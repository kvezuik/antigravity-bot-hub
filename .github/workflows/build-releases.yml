name: Build and Release Binaries (Linux AppImage & Windows EXE)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --clean -y --name agybots --onedir --add-data "web:web" --add-data "data:data" main.py

      - name: Prepare AppDir & AppImage
        run: |
          mkdir -p build/AppDir/usr/bin build/AppDir/usr/share/icons/hicolor/256x256/apps build/AppDir/usr/share/applications
          cp -r dist/agybots/* build/AppDir/usr/bin/
          cp -r web build/AppDir/usr/bin/
          cp -r data build/AppDir/usr/bin/
          cp agybots.png build/AppDir/usr/share/icons/hicolor/256x256/apps/
          cp agybots.png build/AppDir/agybots.png
          cp packaging/agybots.desktop build/AppDir/
          cp packaging/agybots.desktop build/AppDir/usr/share/applications/
          cp packaging/AppRun build/AppDir/
          chmod +x build/AppDir/AppRun

          # Download appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run build/AppDir AntigravityBotHub-x86_64.AppImage
          cp AntigravityBotHub-x86_64.AppImage AntigravityBotHub-Linux-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityBotHub-Linux-AppImage
          path: AntigravityBotHub-Linux-x86_64.AppImage

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --clean -y --onefile --name AntigravityBotHub-Windows-x86_64.exe --add-data "web;web" --add-data "data;data" main.py
          copy dist\AntigravityBotHub-Windows-x86_64.exe dist\agybots.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityBotHub-Windows-EXE
          path: dist/AntigravityBotHub-Windows-x86_64.exe

  release:
    name: Create GitHub Release
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: AntigravityBotHub-Linux-AppImage
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AntigravityBotHub-Windows-EXE
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
